---
- name: Server Hardening & Optimization (as new user)
  hosts: vps
  gather_facts: true
  vars_files:
    - vars.yml
  vars:
    ansible_user: "{{ new_user }}"
    ansible_password: "{{ new_user_password }}"
    ansible_become: true
    ansible_become_password: "{{ new_user_password }}"

  tasks:
    - name: Final apt autoremove and cache clear
      ansible.builtin.apt:
        autoremove: yes
        purge: yes
        clean: yes

    - name: Configure SSH to disable root login and enforce password authentication
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/99-custom-auth.conf
        content: |
          PermitRootLogin no
          PasswordAuthentication yes
          KbdInteractiveAuthentication yes
        owner: root
        group: root
        mode: '0644'
        validate: sshd -t -f %s
      notify: Reboot Server

  handlers:
    - name: Reboot Server
      ansible.builtin.reboot:
        reboot_timeout: 65
        post_reboot_delay: 15
        connect_timeout: 15
