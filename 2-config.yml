---
- name: Server Hardening & Optimization (as new user)
  hosts: vps
  gather_facts: true
  vars_files:
    - vars.yml
  vars:
    ansible_user: "{{ new_user }}"
    ansible_password: "{{ new_user_password }}"
    ansible_become: true
    ansible_become_password: "{{ new_user_password }}"

  tasks:
    - name: Configure SSH to disable root login and enforce password authentication
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/99-custom-auth.conf
        content: |
          PermitRootLogin no
          PasswordAuthentication yes
          KbdInteractiveAuthentication yes
        owner: root
        group: root
        mode: '0644'
      notify: Restart SSH Service

    - name: Ensure journalctl drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Configure journalctl log size limits
      ansible.builtin.copy:
        dest: /etc/systemd/journald.conf.d/00-journal-limits.conf
        content: |
          [Journal]
          SystemMaxUse=100M
          SystemMaxKeepFiles=5
          MaxRetentionSec=7day
        owner: root
        group: root
        mode: '0644'
      notify: Restart Journald Service

    - name: Immediately vacuum journal logs exceeding limit
      ansible.builtin.command: journalctl --vacuum-size=100M
      changed_when: false

    - name: Final apt autoremove and cache clear
      ansible.builtin.apt:
        autoremove: yes
        purge: yes
        clean: yes

  handlers:
    - name: Restart SSH Service
      ansible.builtin.service:
        name: ssh
        state: restarted

    - name: Restart Journald Service
      ansible.builtin.service:
        name: systemd-journald
        state: restarted
